# Docuccino reads this file, at the root of your project, for everything that shapes a document.
#
# The framework's own config/docuccino.php keeps only what Laravel needs while it BOOTS — the master
# switch, each document's viewer wiring and the cache store — so no page load parses this file.
# Anything else left in config/docuccino.php is reported and ignored.
#
# Every setting below is shown with its default; optional ones are commented out. A key written here,
# even as an empty value, is part of the configuration this document is fingerprinted from, so leave
# the ones you are not using commented.

# Each entry is an independent build with its own routes, info, security and export target. Add more
# alongside `default` to emit a multi-document set — they share route analysis, so a second document
# is cheap. The viewer for a document is configured in config/docuccino.php under the same key.
documents:

  default:

    # Declares that this document IS an API version: the one below is `info.version`, every operation
    # publishes the header a client pins a version with, and every change declared under `changes`
    # that shipped AFTER this version is applied in reverse to derive the older shape. Absent means
    # the document is not a version at all.
    # api_version:
    #   # Where the #[ApiVersionChange] classes live, relative to the base path. A list of
    #   # directories, each of which may be a glob, so a modular app keeps its changes beside the
    #   # modules that own them: 'modules/*/Api/Versions'.
    #   changes: ['app/Api/Versions']
    #   # The request header the version enum is published on.
    #   header: 'X-Api-Version'

    # The OpenAPI `info` object. Any other OAS info field (contact, license…) passes through.
    info:
      title: 'API Documentation'
      version: '1.0.0'
      # Markdown. Either inline — `description: 'Written here.'` — or read out of a file.
      # description: { file: 'resources/docs/api/description.md' }

    # The OpenAPI `servers` array. Each entry is an OAS Server Object, written as
    # `{ url: 'https://api.example.com', description: 'Production' }`. Left empty, the document
    # publishes your `app.url` when that names a host a client could reach, and nothing at all when
    # it does not — which OpenAPI reads as the origin the document is served from.
    servers: []

    # Which routes belong to this document.
    routes:
      include: ['api/*']
      exclude: []
      # A class implementing Docuccino\Core\Extensions\Contracts\RouteFilter, resolved from the
      # container and asked about every route the wildcards above admitted.
      # filter: App\Docs\PublicRoutes
      # Also document routes whose controller lives under vendor/. Off by default, matching
      # `php artisan route:list --except-vendor`; closures and your own controllers are unaffected
      # either way.
      include_vendor: false

    security:
      # Routes whose middleware matches this wildcard get the `default` requirement below.
      auth_middleware: 'auth*'
      # Your own schemes, emitted as `components.securitySchemes`. Sanctum and Passport contribute
      # theirs automatically when installed.
      # schemes:
      #   bearer: { type: 'http', scheme: 'bearer', bearerFormat: 'JWT' }
      #   apiKey: { type: 'apiKey', in: 'header', name: 'X-API-Key' }
      # The per-operation requirement applied to routes matched by auth_middleware.
      # default: [{ bearer: [] }]
      # A requirement applied to the whole document.
      # document: [{ bearer: [] }]

    # 'default' documents the framework's own JSON error shapes for the exceptions it renders itself,
    # 'none' emits no error responses. What your own handlers return is read either way.
    error_responses: 'default' # default | none

    tags:
      # How an operation with no #[Group] is tagged: 'controller' (InvoiceController → "Invoice",
      # then through `map`) or 'none'. Closure routes are never auto-tagged.
      default_strategy: 'controller' # controller | none
      # Raw tag => display tag. An exact match wins, else the first prefix the tag starts with.
      map: {}
      # A container-resolved TagMapper, replacing the prefix mapper over `map`.
      # mapper: 'App\Docs\InvoiceTagMapper'
      # The OpenAPI top-level `tags`, sorted by weight then name. `parent` nests one entry under
      # another (it must name a tag defined here) and `kind` categorises it — both OAS 3.2 only, so
      # the 3.1 downlevel drops them with a warning.
      # definitions:
      #   - { name: 'Billing', summary: 'Billing', kind: 'nav', weight: 0 }
      #   - { name: 'Invoices', description: 'Billing documents.', parent: 'Billing' }

    # Where #[Webhook] classes live: every annotated class found under here is published as a
    # webhook. Relative to the base path; absent means the document has none.
    # webhooks: { dir: 'app/Webhooks' }

    # A markdown tree compiled into the document as pages and navigation.
    content:
      dir: null # e.g. 'resources/docs/api'

    # Response bodies your test suite recorded, published as examples. The build only ever READS
    # these committed files — nothing is executed and no database is touched; the recording is
    # written by your suite (ApiContract::record()). Absent means the document publishes no
    # recorded examples.
    # examples: { recordings: 'docs/recordings' }

    # Where the contract-coverage recorder writes what your test suite exercised, and where
    # `docuccino:coverage` reads it back. Absent means storage/docuccino/coverage.
    # coverage: { log: 'storage/docuccino/coverage' }

    # Overlay 1.0 documents applied to the finished build: globs relative to the base path, written
    # as `['resources/docs/overlays/*.yaml']`.
    overlays: []

    # How inferred facts are expressed in the spec. Every default below is the shape most codegen
    # tools expect; change one only if your consumers prefer the alternative.
    representation:
      filters: 'bracketed'       # bracketed: one filter[status] param | deepObject: a single `filter` object
      nullable: 'type-array'     # type-array: type: [string, null] | anyof: a {type: null} branch
      # Where the strategy has nothing to read — an unnamed route, a closure — the operationId is
      # minted from the operation's own method and path (GET /api/forms -> get.api.forms).
      operation_id: 'route-name' # route-name | controller-method (InvoiceController@store)
      # enums:
      #   naming: 'names'   # names (both hint spellings) | none | x-enumNames | x-enum-varnames
      #   components: true  # true hoists each enum to a $ref'd component; false inlines it
      # errors:
      #   # true hoists an error body repeated across operations to one $ref'd components.responses
      #   # entry; false inlines every copy
      #   components: true
      # pagination:
      #   # true hoists a paginated envelope to one $ref'd component per item type and paginator
      #   # kind; false inlines every copy
      #   components: true
      # examples:
      #   # JSON Schema `format` => the value Docuccino illustrates it with — synthesized examples
      #   # and a Postman collection's fabricated bodies alike — merged over the built-ins. Still
      #   # validated against each field's own rules; one that fails falls back to the built-in
      #   # sample and says so.
      #   formats: { email: 'jane@example.com' }

    # The policy `docuccino:diff --enforce` holds a changeset to. It also names the order two
    # versions are in, which is the order an `api_version` document applies its changes in.
    versioning: 'none' # none | semver | date

    # Per-integration switches and knobs. Every integration is on as soon as its package is
    # installed — except `permission`, which is opt-in because documenting role and permission names
    # publishes your app's internal authorization taxonomy. An integration that is installed but
    # disabled emits one `integration.disabled` info diagnostic per build, so the switch is always
    # discoverable from the output.
    integrations: {}
    #   api_resources:
    #     enabled: true
    #     # false never wraps (matches a global withoutWrapping()); true wraps in 'data'; a string
    #     # forces that key; omit to follow each resource's own $wrap.
    #     wrap: true
    #   eloquent: { enabled: true }
    #   rate_limit: { enabled: true }
    #   spatie_data: { enabled: true }
    #   query_builder:
    #     enabled: true
    #     pagination_terminals: ['paginateList'] # your own paginating method names
    #     # Filter kind => the sentence that leads its description, merged over the built-ins (kinds
    #     # you leave out keep theirs). `%field%` is the one supported token: the filter's name.
    #     filter_descriptions: { exact: 'Matches `%field%` exactly.' }
    #   json_api_paginate: { enabled: true }
    #   timacdonald_json_api: { enabled: true }
    #   laravel_actions: { enabled: true }
    #   sanctum:
    #     enabled: true
    #     modes: ['token', 'stateful'] # which schemes to expose (default: both)
    #     cookie: 'myapp_session'      # stateful cookie name (default: session.cookie)
    #   passport:
    #     enabled: true
    #     url: 'https://auth.example.com' # oauth2 flow base URL (default: app.url)
    #   permission: { enabled: true } # opt in to x-permissions + the requirement lines

    # Where `docuccino:export` writes, and what the viewer's `artifact` source reads back.
    export:
      path: 'docs/openapi.json'
      # A list of targets REPLACES `path`: one build, one artifact per entry. One target per format
      # — openapi-3.2, openapi-3.1, openapi-3.0, uir, postman — and the extension picks the
      # serialisation (.yaml/.yml emit YAML).
      # targets:
      #   - { format: 'openapi-3.2', path: 'docs/openapi.json' }
      #   - { format: 'openapi-3.1', path: 'docs/openapi-3.1.yaml' }
      # The member #[Mock] hints are published under in the OpenAPI artifacts. Absent keeps them out,
      # so an export is pure OpenAPI; the UIR carries them either way.
      # mock_faker_key: 'x-faker'

# Your own extension class-strings, resolved from the container at build time and merged with
# anything registered through Docuccino::extend(), written as `['App\Docs\InvoiceTotalsExtension']`.
extensions: []

# Document lint rules. They only ever raise diagnostics — nothing here can change the emitted
# document.
lint:
  # Warns when a schema property name or a query/path parameter name looks sensitive
  # (password/token/secret/api_key…), and when a published example, const, enum or default value
  # looks like a credential.
  leakage:
    enabled: true
    # Property names, parameter names or JSON pointers to accept, e.g.
    # ['reset_token', '/components/schemas/Invoice/properties/status']. A name silences this lint
    # only; the response recorder redacts by name regardless and honours a pointer alone.
    allow: []
    # Extra heuristics, merged over the built-in table (built-in tokens keep their label). Key = a
    # token matched anywhere inside a property or parameter name, value = the label.
    # patterns: { sortcode: 'a bank sort code', iban: 'an IBAN' }
  # Warns on an operation that publishes neither a summary nor a description. Off by default: on an
  # application that documents nothing it fires once per operation.
  descriptions:
    enabled: false
    # Operation signatures or operationIds to accept, e.g. ['GET /api/ping'].
    allow: []
  # Warns on an operationId a generated client cannot name a method after — empty, leading with a
  # digit, or outside letters, digits and . - _ @. Duplicates are a separate diagnostic
  # (route.duplicate-operation-id). Nothing Docuccino mints can trip it.
  operation_ids:
    enabled: true
    # Operation signatures or operationIds to accept, e.g. ['GET /api/ping'].
    allow: []
  # Warns on a tag operations carry that tags.definitions never declares. Silent unless the document
  # declares tags at all — and off besides, because declaring a few nav parents while the rest derive
  # from controllers is a deliberate shape, not a hole.
  tags:
    enabled: false
    # Tag names to accept, e.g. ['Internal'].
    allow: []
  # Flags an anyOf whose empty {} branch accepts anything, making its typed branches decorative.
  # vacuous_union:
  #   enabled: true
  #   # Operation signatures or operationIds to accept, e.g. ['GET /api/ping'].
  #   allow: []
  # Checks every published example against the schema beside it — a consumer copies an example and
  # sends it back, so one the schema rejects is worse than none.
  # examples:
  #   enabled: true
  #   # JSON pointers as the message prints them, or the label it names, e.g.
  #   # ['/components/schemas/Invoice/properties/status/example'].
  #   allow: []
  # Flags a redirect the document doesn't say exactly one thing about: the 3XX range alone, or the
  # range still standing beside a concrete 3xx.
  # unpinned_redirect:
  #   enabled: true
  #   # Operation signatures or operationIds to accept, e.g. ['GET /auth/callback'].
  #   allow: []

# Codes you have read and accepted. An accepted diagnostic still prints, marked `accepted`, and stops
# counting towards `--fail-on` — so a stricter gate can go on before the last report is fixed. An
# error is never accepted, and an entry nothing reports warns so the list cannot rot.
diagnostics:
  accept: [] # e.g. ['eloquent.no-columns']

# Which engine backs type inference. A boot failure always degrades to no inference rather than
# failing the build, so docblock- and attribute-driven documentation keeps working.
engine:
  # 'in-process' runs PHPStan; 'null' skips inference entirely. Inference needs the dev-only
  # docuccino/inference-phpstan package — without it 'in-process' warns and falls back. Anything else
  # warns and runs in-process rather than failing the build. DOCUCCINO_ENGINE overrides this.
  mode: 'in-process' # in-process | null
  # PHP memory limit for inference, which runs PHPStan inside the calling process. Applied on console
  # builds only, and only ever RAISES — an already-higher (or unlimited) process is left alone, and
  # `-1` isn't accepted here. `--memory-limit` on the build commands overrides it.
  # memory_limit: '2G'
  # Directories the engine descends into for interprocedural analysis (throw classification, inline
  # `Validator::make(...)` rules). Defaults to every PSR-4 source root your composer.json declares
  # under `autoload` — a modular `Modules\…` root included — so an error raised a hop below a
  # controller is documented wherever that code lives. Set this to narrow descent to part of your
  # application; `autoload-dev` roots and vendor code are never descended into either way.
  # project_paths: ['app']
  # Your own analyser configuration file, included by the one the engine writes, so the extensions
  # and stubs you already maintain shape your documentation too. Relative to the base path; a file
  # that isn't there warns and inference runs without it.
  # config: 'phpstan.neon'

# What a route whose analysis fails leaves behind: 'skeleton' keeps the path with a diagnostic,
# 'omit' drops it from the document.
on_route_error: 'skeleton' # skeleton | omit

cache:
  # The per-operation fragment cache: incremental rebuilds. `docuccino:watch` turns it on for the
  # builds it drives by setting DOCUCCINO_FRAGMENT_CACHE, which overrides this.
  enabled: false
  # path: null # fragment directory (default: storage_path('docuccino/fragments'))
